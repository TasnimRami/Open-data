<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حرف التراث السعودي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--sand:#ece6f7;--brown:#3b2a5c;--gold:#9b7fd1;--green:#6b4fa3;--red:#b03a5b}
html{height:100%}*{box-sizing:border-box}
body{margin:0;min-height:100%;font-family:'Tajawal',Tahoma,Arial,sans-serif;color:var(--brown);background-color:var(--sand);
background-image:linear-gradient(135deg,rgba(155,127,209,.2) 25%,transparent 25%),linear-gradient(225deg,rgba(155,127,209,.2) 25%,transparent 25%),linear-gradient(45deg,rgba(59,42,92,.08) 25%,transparent 25%),linear-gradient(315deg,rgba(59,42,92,.08) 25%,transparent 25%);background-size:44px 44px;background-position:22px 0,22px 0,0 0,0 0}
.screen{display:none;min-height:100vh;padding:16px 12px;flex-direction:column;align-items:center;justify-content:center;text-align:center;max-width:600px;margin:auto}
.screen.on{display:flex}
.frame{border:4px double var(--gold);background:rgba(250,247,255,.94);border-radius:18px;padding:18px 14px;width:100%;box-shadow:0 6px 18px rgba(59,42,92,.25)}
h1{font-size:2.1rem;margin:6px 0;font-weight:800}.sub{margin:0 0 18px;font-size:1.05rem}.palm{font-size:3rem}
button{font-family:inherit;cursor:pointer;border:0;border-radius:12px;font-weight:800}
.big{background:var(--green);color:#fff;font-size:1.4rem;padding:12px 44px;box-shadow:0 4px 0 #4a3578}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 #4a3578}
.small{background:var(--gold);color:#fff;padding:8px 18px;font-size:1rem;margin-top:12px}
.setup{margin-top:14px;text-align:right;display:none}.setup.on{display:block}
.setup label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0;font-weight:700;font-size:.95rem}.setup input{max-width:55%;font-size:.8rem}
.score{font-weight:700;margin-bottom:6px}
.pic{font-size:5rem;background:#fff;border:3px solid var(--gold);border-radius:14px;padding:6px 0;margin:8px auto;width:150px;line-height:1.3}
.pic.has{width:230px;padding:0;overflow:hidden;font-size:0}.pic.has img{display:block;width:100%;height:160px;object-fit:cover}
.q{font-size:1.2rem;font-weight:800;margin:6px 0}
#map3d{width:100%;max-width:520px;height:380px;margin:auto;touch-action:none;cursor:grab}#map3d canvas{display:block;width:100%;height:100%}
.hint{font-size:.85rem;opacity:.8}
.legend{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.lg{background:#fff;color:var(--brown);border:1px solid var(--gold);border-radius:20px;padding:4px 10px;font-size:.85rem;font-weight:700}
.lg b{color:var(--green)}
.overlay{position:fixed;inset:0;background:rgba(30,18,55,.65);display:none;align-items:center;justify-content:center;padding:16px;z-index:5}.overlay.on{display:flex}
.card{background:#faf7ff;border:4px double var(--gold);border-radius:18px;padding:18px;max-width:420px;width:100%;max-height:92vh;overflow-y:auto;text-align:right}
.res{font-weight:800;font-size:1.2rem;text-align:center;margin:0 0 8px}.ok{color:var(--green)}.no{color:var(--red)}
.card h2{margin:4px 0;text-align:center}.card .pic{width:100px;font-size:3.2rem}.card .pic.has{width:200px}
.card p{margin:6px 0;line-height:1.7}.card b{color:var(--red)}
.card .big{display:block;margin:12px auto 0;font-size:1.2rem;padding:10px 36px}
</style>
</head>
<body>
<div id="start" class="screen on">
  <div class="frame">
    <div class="palm">🌴🐪🌴</div>
    <h1>حرف التراث السعودي</h1>
    <p class="sub">اختبر معرفتك بالحرف اليدوية في مناطق المملكة العربية السعودية</p>
    <button class="big" id="go">ابدأ</button>
  </div>
</div>

<div id="game" class="screen">
  <div class="frame">
    <div class="score">النقاط: <span id="sc">0</span> / <span id="tot">0</span></div>
    <div class="q" id="qt"></div>
    <div class="pic" id="pic"></div>
    <div id="map3d"></div>
    <div class="hint">اسحب لتدوير الخريطة، واضغط على المنطقة أو رقمها، أو اختر من القائمة</div>
    <div class="legend" id="legend"></div>
  </div>
</div>
<div class="overlay" id="ov"><div class="card" id="card"></div></div>

const EX={7:[15,16],15:[7],16:[7],9:[14],14:[9]};
const $=id=>document.getElementById(id);
let score=0,total=0,cur=null,last=-1,locked=false,sel=[],disp={},T3=0,applyScene=()=>{},drawNum=()=>{};
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id))}
function setPic(el,c){if(c.img){el.classList.add("has");el.innerHTML='<img alt="'+c.n+'" src="'+c.img+'">'}else{el.classList.remove("has");el.textContent=c.e}}

function next(){
  let i;do{i=Math.floor(Math.random()*crafts.length)}while(i===last);
  last=i;cur=crafts[i];locked=false;
  const others=Object.keys(R).map(Number).filter(k=>k!==cur.r&&!(EX[cur.r]||[]).includes(k)).sort(()=>Math.random()-.5).slice(0,4);
  sel=[cur.r].concat(others).sort(()=>Math.random()-.5);
  sel.forEach((k,j)=>disp[k]=j+1);
  setPic($("pic"),cur);$("qt").textContent="حرفة «"+cur.n+"»: من أي منطقة هي؟";
  $("sc").textContent=score;$("tot").textContent=total;
  const order=sel.slice().sort((a,b)=>disp[a]-disp[b]);
  $("legend").innerHTML=order.map(k=>'<button class="lg" data-r="'+k+'"><b>'+disp[k]+'</b> - '+R[k]+'</button>').join('');
  applyScene();
}
$("legend").addEventListener("click",e=>{const b=e.target.closest(".lg");if(b)answer(+b.dataset.r)});

function answer(k){
  if(locked||!sel.includes(k))return;locked=true;total++;
  const ok=k===cur.r;if(ok)score++;
  $("card").innerHTML='<p class="res '+(ok?'ok':'no')+'">'+(ok?'✅ إجابة صحيحة!':'❌ إجابتك خطأ')+'</p>'+
   '<div class="pic" id="cpic"></div><h2>'+cur.n+'</h2>'+
   '<p><b>المنطقة:</b> '+R[cur.r]+'</p><p><b>الوصف:</b> '+cur.d+'</p>'+
   '<p><b>المواد المستخدمة:</b> '+cur.m+'</p><p><b>أين تُستخدم:</b> '+cur.u+'</p>'+
   '<button class="big" id="learn">تعلّمت</button>';
  $("ov").classList.add("on");setPic($("cpic"),cur);
  $("learn").onclick=()=>{$("ov").classList.remove("on");show("start")};
}
